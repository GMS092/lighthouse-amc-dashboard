name: Update News Flow Snapshot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/news-flow.yml"
      - "modules/news-flow/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: news-flow-snapshot
  cancel-in-progress: true

jobs:
  update-news-flow:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dashboard
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install collector dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests urllib3 beautifulsoup4 lxml

      - name: Check external news bot settings
        id: bot-settings
        env:
          NEWS_BOT_REPOSITORY: ${{ vars.NEWS_BOT_REPOSITORY }}
          NEWS_BOT_REPO_TOKEN: ${{ secrets.NEWS_BOT_REPO_TOKEN }}
        run: |
          if [ -n "$NEWS_BOT_REPOSITORY" ]; then
            echo "has_repo=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_repo=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$NEWS_BOT_REPO_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout external news bot with token
        if: steps.bot-settings.outputs.has_repo == 'true' && steps.bot-settings.outputs.has_token == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.NEWS_BOT_REPOSITORY }}
          token: ${{ secrets.NEWS_BOT_REPO_TOKEN }}
          path: external-news-bot

      - name: Checkout public external news bot
        if: steps.bot-settings.outputs.has_repo == 'true' && steps.bot-settings.outputs.has_token != 'true'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.NEWS_BOT_REPOSITORY }}
          path: external-news-bot

      - name: Select collector inputs
        run: |
          if [ -f "external-news-bot/dynamic_feeds.json" ]; then
            echo "Using external news bot feed list and crawler."
          else
            echo "External news bot repository is not configured or does not contain dynamic_feeds.json."
            echo "Using modules/news-flow/feeds.json and skipping external crawler."
          fi

      - name: Collect news snapshot
        env:
          TELEGRAM_BOT_DIR: ${{ github.workspace }}/external-news-bot
        run: python modules/news-flow/collect.py

      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news-flow.json
          if git diff --cached --quiet; then
            echo "No news snapshot changes."
          else
            git commit -m "chore: update news flow snapshot"
            git push
          fi

      - name: Prepare static site
        run: |
          mkdir -p _site/assets _site/data _site/docs
          cp dashboard.html phase.html news.html research.html weight.html _site/
          cp -R assets/. _site/assets/
          cp -R data/. _site/data/
          cp docs/UPDATE_NOTES.md _site/docs/UPDATE_NOTES.md
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Lighthouse AMC</title>
              <meta http-equiv="refresh" content="0; url=dashboard.html" />
              <link rel="canonical" href="dashboard.html" />
            </head>
            <body><p><a href="dashboard.html">Lighthouse AMC 대시보드로 이동</a></p></body>
          </html>
          HTML
          node <<'NODE'
          const fs = require('fs');
          const disableRefresh = '<script>(function(){var b=document.getElementById("refresh-btn");if(!b)return;b.disabled=true;b.title="GitHub Pages에서는 데이터 스냅샷을 표시합니다. 데이터 갱신은 자동 수집 작업에서 실행합니다.";var t=b.querySelector(".refresh-text");if(t)t.textContent="자동 수집";})();</script>';
          const researchNav = '<a class="nav-item" href="research.html"><span class="nav-dot" aria-hidden="true"></span><span>리서치 플로우</span></a>';
          function addResearchNav(file) {
            let html = fs.readFileSync(file, 'utf8');
            if (!html.includes('href="research.html"')) {
              html = html.replace(/(<a class="nav-item(?: active)?" href="news\.html"><span class="nav-dot" aria-hidden="true"><\/span><span>뉴스플로우<\/span><\/a>)/, '$1\n          ' + researchNav);
            }
            fs.writeFileSync(file, html);
          }
          function patch(file, api, data, disable) {
            let html = fs.readFileSync(file, 'utf8');
            html = html.replaceAll('fetch("' + api + '")', 'fetch("' + data + '")');
            html = html.replaceAll("fetch('" + api + "')", "fetch('" + data + "')");
            html = html.replaceAll('fetch(dataUrl("' + api + '", "' + data + '"))', 'fetch("' + data + '")');
            html = html.replaceAll("fetch(dataUrl('" + api + "', '" + data + "'))", "fetch('" + data + "')");
            if (disable && !html.includes('GitHub Pages에서는 데이터 스냅샷')) {
              html = html.replace('</body>', disableRefresh + '\n  </body>');
            }
            fs.writeFileSync(file, html);
          }
          ['_site/dashboard.html', '_site/phase.html', '_site/weight.html', '_site/news.html'].forEach(addResearchNav);
          patch('_site/phase.html', '/api/phase', 'data/phase-classification.json', true);
          patch('_site/news.html', '/api/news', 'data/news-flow.json', true);
          patch('_site/research.html', '/api/news', 'data/news-flow.json', false);
          patch('_site/weight.html', '/api/weight', 'data/weight-check.json', false);
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
