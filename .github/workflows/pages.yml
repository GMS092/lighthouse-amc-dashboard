name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir -p _site/assets _site/data _site/docs
          cp dashboard.html phase.html news.html research.html weight.html relative.html semianalysis.html dramexchange.html semiconductor-engineering.html trendforce.html wccfetch.html a16z-news.html _site/
          cp -R assets/. _site/assets/
          cp -R data/. _site/data/
          cp docs/UPDATE_NOTES.md _site/docs/UPDATE_NOTES.md
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Lighthouse AMC</title>
              <meta http-equiv="refresh" content="0; url=dashboard.html" />
              <link rel="canonical" href="dashboard.html" />
            </head>
            <body><p><a href="dashboard.html">Lighthouse AMC 대시보드로 이동</a></p></body>
          </html>
          HTML
          node <<'NODE'
          const fs = require('fs');
          const disableRefresh = '<script>(function(){var b=document.getElementById("refresh-btn");if(!b)return;b.disabled=true;b.title="GitHub Pages에서는 데이터 스냅샷을 표시합니다. 데이터 갱신은 로컬 서버 또는 수집 작업에서 실행합니다.";var t=b.querySelector(".refresh-text");if(t)t.textContent="보기 전용";})();</script>';
          const siteFiles = ['dashboard.html','phase.html','weight.html','relative.html','news.html','research.html','semianalysis.html','dramexchange.html','semiconductor-engineering.html','trendforce.html','wccfetch.html','a16z-news.html'];
          const navItems = [
            ['dashboard.html', '홈'],
            ['phase.html', '투자의 정석 (동부)'],
            ['weight.html', '전자, 닉스 비중 체크'],
            ['relative.html', '상대수익률 추이'],
            ['news.html', '뉴스플로우'],
            ['semianalysis.html', 'SemiAnalysis'],
            ['dramexchange.html', 'DRAMeXchange'],
            ['semiconductor-engineering.html', 'Semiconductor Engineering'],
            ['trendforce.html', 'TrendForce'],
            ['wccfetch.html', 'WCCFetch'],
            ['a16z-news.html', 'a16Z News']
          ];
          function patch(file, api, data, disable) {
            let html = fs.readFileSync(file, 'utf8');
            html = html.replaceAll('fetch("' + api + '")', 'fetch("' + data + '")');
            html = html.replaceAll("fetch('" + api + "')", "fetch('" + data + "')");
            html = html.replaceAll('fetch(dataUrl("' + api + '", "' + data + '"))', 'fetch("' + data + '")');
            html = html.replaceAll("fetch(dataUrl('" + api + "', '" + data + "'))", "fetch('" + data + "')");
            if (disable && !html.includes('GitHub Pages에서는 데이터 스냅샷')) {
              html = html.replace('</body>', disableRefresh + '\n  </body>');
            }
            fs.writeFileSync(file, html);
          }
          function navLink(href, label, current) {
            const active = href === current ? ' active' : '';
            return '<a class="nav-item' + active + '" href="' + href + '"><span class="nav-dot" aria-hidden="true"></span><span>' + label + '</span></a>';
          }
          function normalizeNav(file) {
            let html = fs.readFileSync(file, 'utf8');
            const current = file.split('/').pop();
            const nav = '<nav class="nav" aria-label="대시보드 메뉴">\n          ' + navItems.map(([href, label]) => navLink(href, label, current)).join('\n          ') + '\n        </nav>';
            html = html.replace(/<nav class="nav" aria-label="대시보드 메뉴">[\s\S]*?<\/nav>/, nav);
            fs.writeFileSync(file, html);
          }
          patch('_site/phase.html', '/api/phase', 'data/phase-classification.json', true);
          patch('_site/news.html', '/api/news', 'data/news-flow.json', true);
          patch('_site/research.html', '/api/news', 'data/news-flow.json', false);
          patch('_site/weight.html', '/api/weight', 'data/weight-check.json', false);
          patch('_site/relative.html', '/api/relative-return', 'data/relative-return.json', true);
          patch('_site/semianalysis.html', '/api/news', 'data/news-flow.json', false);
          patch('_site/dramexchange.html', '/api/news', 'data/news-flow.json', false);
          patch('_site/semiconductor-engineering.html', '/api/news', 'data/news-flow.json', false);
          patch('_site/trendforce.html', '/api/news', 'data/news-flow.json', false);
          patch('_site/wccfetch.html', '/api/news', 'data/news-flow.json', false);
          patch('_site/a16z-news.html', '/api/news', 'data/news-flow.json', false);
          siteFiles.forEach(file => normalizeNav('_site/' + file));
          NODE
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
